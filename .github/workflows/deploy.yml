name: Deploy

# Mirrors scripts/deploy.sh: build arm64 image -> push to ECR (immutable tags) -> deploy on EC2 via SSM -> /health.
# Requires repository variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_URL, EC2_INSTANCE_ID, APP_URL.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # Skips (instead of failing) until the OIDC role exists and the repo variables are set (README §3)
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      REPO_URL: ${{ vars.ECR_REPOSITORY_URL }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables
        run: |
          missing=0
          for v in REPO_URL INSTANCE_ID APP_URL; do
            [ -n "${!v}" ] || { echo "::error::repository variable for $v is not set"; missing=1; }
          done
          [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || { echo "::error::AWS_DEPLOY_ROLE_ARN is not set"; missing=1; }
          exit $missing

      - name: Compute image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ticketdesk-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ steps.tag.outputs.tag }} (linux/arm64)
        run: |
          docker buildx build --platform linux/arm64 --provenance=false \
            -t "$REPO_URL:${{ steps.tag.outputs.tag }}" --push app

      - name: Deploy on EC2 via SSM
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # cloud-init status --wait: on a fresh instance, user data may still be running
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "ticketdesk deploy $TAG (gha run ${{ github.run_id }})" \
            --parameters "commands=[\"cloud-init status --wait >/dev/null || true\",\"/opt/ticketdesk/deploy.sh $TAG\"]" \
            --query 'Command.CommandId' --output text)
          echo "SSM command id: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output text
          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deploy command finished with status $STATUS (command id $CMD_ID)"
            exit 1
          fi

      - name: Health check
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$APP_URL/health" >/dev/null 2>&1; then echo "healthy (${{ steps.tag.outputs.tag }})"; exit 0; fi
            sleep 5
          done
          echo "::error::App did not become healthy at $APP_URL/health. Check: aws logs tail /ticketdesk-poc/app"
          exit 1
