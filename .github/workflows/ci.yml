name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.10.5"

jobs:
  python:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt
      - name: Ruff
        run: ruff check app lambda
      - name: App tests
        working-directory: app
        run: pytest -q
      - name: Lambda tests
        run: pytest -q lambda/test_handler.py

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan git history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  image:
    name: Docker build + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ticketdesk-app:ci app
      - name: Trivy scan (HIGH/CRITICAL, fixable only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ticketdesk-app:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform fmt/validate + tfsec + checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: terraform validate (bootstrap)
        working-directory: terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate
      - name: terraform validate (envs/dev)
        working-directory: terraform/envs/dev
        run: terraform init -backend=false -input=false && terraform validate
      # tfsec only reads the first root module it finds, so scan each root separately (docs/problems.md #6)
      - name: tfsec (envs/dev)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/envs/dev
          additional_args: --minimum-severity HIGH
      - name: tfsec (bootstrap)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/bootstrap
          additional_args: --minimum-severity HIGH
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          compact: true
          quiet: false
