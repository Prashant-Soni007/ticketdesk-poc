{# Shared UI pieces. Status and priority always carry text, never color alone. #}
{% macro status(s) -%}
<span class="status status-{{ s|lower|replace(' ', '-') }}">{{ s }}</span>
{%- endmacro %}
{% macro prio(p) -%}
<span class="prio prio-{{ p|lower }}"><span class="prio-bars" aria-hidden="true"><i></i><i></i><i></i></span>{{ p }}</span>
{%- endmacro %}
{% macro icon(name, size=16) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'file' %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>
{%- elif name == 'alert' %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/>
{%- elif name == 'back' %}<path d="M15 18l-6-6 6-6"/>
{%- elif name == 'arrow' %}<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
{%- elif name == 'upload' %}<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/>
{%- endif %}</svg>
{%- endmacro %}
{% macro brand() -%}
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" focusable="false"><rect x="1" y="1" width="20" height="20" rx="4" fill="#1c1b18"/><path d="M6 8h10M6 11.5h7M6 15h4" stroke="#f4f2ee" stroke-width="2" stroke-linecap="round"/></svg>
<span>TicketDesk</span>
{%- endmacro %}
