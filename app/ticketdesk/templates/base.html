{% from "_ui.html" import brand %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TicketDesk{% endblock %} · TicketDesk</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% if user %}
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/dashboard">{{ brand() }}</a>
    <nav class="nav" aria-label="Main">
      <a href="/dashboard"{% if active == 'dashboard' %} aria-current="page"{% endif %}>Overview</a>
      <a href="/tickets"{% if active == 'tickets' %} aria-current="page"{% endif %}>Tickets</a>
    </nav>
    <div class="who">
      <span class="name">{{ user.username }}</span>
      <span class="role" title="Role">{{ user.role }}</span>
      <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn btn-quiet btn-sm">Sign out</button></form>
    </div>
  </div>
</header>
<main id="main">{% block content %}{% endblock %}</main>
{% else %}
<main id="main" style="padding:0;max-width:none">{% block bare %}{% endblock %}</main>
{% endif %}
</body>
</html>
